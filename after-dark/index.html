<!doctype html>
<html lang="en" data-mode="stillness">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find a film or series by mood. A free suggestion tool by Jatin Bhatt.">
<meta name="theme-color" content="#f3ede2">
<title>After Dark · Jatin Bhatt</title>
<link rel="canonical" href="https://jatinbhatt.me/after-dark/">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles.css">
<script>try{if(localStorage.getItem('jb-mode')==='signal')document.documentElement.dataset.mode='signal';}catch{}</script>
<link rel="stylesheet" href="style.css">
<script defer src="public.js?v=1"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead top">
  <a class="mark wordmark" href="../" aria-label="Jatin Bhatt, home"><span class="wm-j">Jatin</span> Bhatt</a>
  <a href="./" aria-current="page">After Dark</a>
</header>
<main id="main">
  <section class="prompt" aria-labelledby="heading">
    <h1 id="heading">What are you in<br class="wide"> the mood for<span>?</span></h1>
    <form id="pick-form">
      <fieldset><legend class="sr-only">Choose a mood</legend><div id="moods" class="moods"></div></fieldset>
      <div class="controls">
        <label>Format <select id="format"><option value="any">Either</option><option>Film</option><option>Series</option></select></label>
        <label>Story focus <select id="focus"><option value="any">Any</option></select></label>
        <label>Genre <select id="genre"><option value="any">Any</option></select></label>
        <label>Film industry <select id="industry"><option value="any">Any</option><option value="hollywood">Hollywood</option><option value="bollywood">Bollywood</option></select></label>
        <label>TMDB rating <select id="rating"><option value="0">Any rating</option><option value="under-6">Under 6</option><option value="6">6+</option><option value="7">7+</option><option value="8">8+</option></select></label>
        <button class="primary" id="submit" type="submit">Find my pick</button>
      </div>
    </form>
    <p id="status" class="status" role="status"></p>
  </section>
  <section id="result" class="result" aria-live="polite" aria-label="Recommendation" hidden>
    <h2 id="title"></h2>
    <p id="details" class="small"></p>
    <div class="pick-actions">
      <button class="quiet" id="skip-pick" type="button">Next pick</button>
      <a id="title-info" href="#" target="_blank" rel="noopener noreferrer">Title details</a>
    </div>
  </section>
</main>
<footer>
  <p>Catalogue adapted from Asaniczka’s <a href="https://www.kaggle.com/datasets/asaniczka/tmdb-movies-dataset-2023-930k-movies">film</a> and <a href="https://www.kaggle.com/datasets/asaniczka/full-tmdb-tv-shows-dataset-2023-150k-shows">series</a> datasets, under <a href="https://opendatacommons.org/licenses/by/1-0/">ODC-By</a>. Ratings are from <a href="https://www.themoviedb.org/">TMDB</a>.</p>
</footer>
</body>
</html>
